services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: market_ai
      POSTGRES_USER: market_ai
      POSTGRES_PASSWORD: market_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market_ai -d market_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://market_ai:market_ai@db:5432/market_ai
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MASSIVE_API_KEY: ${MASSIVE_API_KEY:-}
      PROVIDER_DATA_DELAY_MINUTES: ${PROVIDER_DATA_DELAY_MINUTES:-180}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
