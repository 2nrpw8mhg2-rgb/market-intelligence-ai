[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "market-intelligence-api"
version = "0.6.0"
description = "Quantitative market intelligence backend"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "exchange-calendars>=4.11,<5",
  "httpx>=0.28,<1",
  "numpy>=2.2,<3",
  "pandas>=2.2,<4",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/cli/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
